<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduPulse AI | Portal Login</title>
<meta content="EduPulse AI - Sign in with your username and password to access your role-based dashboard." name="description"/>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Google Font: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="css/common.css" rel="stylesheet"/>
<link href="css/auth.css" rel="stylesheet"/>
</head>
<body class="auth-body auth-bg-unified text-slate-100 antialiased min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white relative overflow-x-hidden">
<!-- Ambient Dynamic Light Effects -->
<div class="ambient-glow top-1/4 left-1/3 w-96 h-96 bg-brand-600/20"></div>
<div class="ambient-glow bottom-10 right-1/4 w-96 h-96 bg-purple-600/15"></div>
<!-- Header -->
<header class="relative z-20 border-b border-slate-800/80 bg-slate-950/70 backdrop-blur-md">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-600 to-emerald-500 flex items-center justify-center text-white font-bold shadow-lg shadow-brand-500/20">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<div>
<span class="font-extrabold text-xl tracking-tight text-white">EduPulse<span class="text-brand-500">AI</span></span>
</div>
</div>
</div>
</header>
<!-- Main Login Card Only -->
<main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 flex flex-col items-center justify-center w-full">
<div class="w-full max-w-md animate-fade-in">
<!-- Top Title -->
<div class="text-center mb-6">
<h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white">
          Sign In
        </h1>

</div>
<!-- Login Card -->
<div class="auth-card p-7 sm:p-8 text-slate-900 shadow-2xl relative">
<!-- Error Alert Container -->
<div class="hidden mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-center gap-2" id="loginError">
</div>
<!-- Login Form -->
<form class="space-y-4" id="loginForm" onsubmit="handleLogin(event)">
<!-- Username Input -->
<div>
<label class="block text-xs font-bold text-slate-700 mb-1" for="username">
              Username
            </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input autocomplete="username" autofocus="" class="auth-input w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:bg-white placeholder-slate-400" id="username" name="username" placeholder="Enter username (student / teacher / admin)" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex items-center justify-between mb-1">
<label class="block text-xs font-bold text-slate-700" for="password">
                Password
              </label>
<a class="text-[11px] font-semibold text-brand-600 hover:text-brand-700 hover:underline" href="#" onclick="showToast('Password Help', 'Default passwords: student123, teacher123, admin123', 'info')">
                Need help?
              </a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input autocomplete="current-password" class="auth-input w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:bg-white placeholder-slate-400" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600" onclick="togglePasswordVisibility()" title="Toggle password visibility" type="button">
<span id="passEyeIcon">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center justify-between text-xs pt-0.5">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 border-slate-300" id="rememberMe" type="checkbox"/>
<span class="text-slate-600 font-medium">Remember me</span>
</label>
</div>
<!-- Submit Button -->
<button class="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl text-sm shadow-md shadow-brand-600/30 transition-all transform active:scale-[0.99] flex items-center justify-center gap-2" id="loginSubmitBtn" type="submit">
<span id="loginSubmitBtnText">Sign In →</span>
</button>
</form>
</div>
</div>
</main>
<!-- Footer -->
<footer class="relative z-10 border-t border-slate-800/80 bg-slate-950 py-4 text-center text-xs text-slate-500">
<div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
<span>EduPulse AI • Institutional Learning Platform</span>
<span class="font-mono text-[11px] text-slate-400">© 2026 EduPulse AI. All rights reserved.</span>
</div>
</footer>
<div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none" id="toastContainer"></div>
<!-- Scripts -->
<script src="js/data.js"></script>
<script src="js/shared.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
